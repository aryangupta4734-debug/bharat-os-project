<html lang="en">

  <title>Bharat OS | Smart Education Project</title>

      box-sizing: border-box;

    body {

      color: #172033;
    }

      background: linear-gradient(135deg, #ff9933, #ffffff, #138808);

      text-align: center;

    header h1 {

      margin-bottom: 7px;

    header p {
      font-size: 15px;

      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .intro {

      padding: 22px;

      margin-bottom: 20px;

    }

    .intro h2 {
      margin-bottom: 10px;
    }

    .notice {
      background: #fff7df;

      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

      padding: 20px;

    }

    .icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

      margin-bottom: 8px;
